packages:
  - "apps/*"
  - "packages/*"

minimumReleaseAge: 4320

# Waives the 3-day age gate for Next.js first-party packages only: `next`
# plus @next/env and the @next/swc-* platform binaries, which are published
# in lockstep with it. Every other package keeps the 3-day gate.
minimumReleaseAgeExclude:
  - next
  - "@next/*"

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true

catalog:
  "@biomejs/biome": "^2.5.10"
  "@types/node": "^26.2.0"
  "@types/react": "19.2.18"
  "@types/react-dom": "19.2.5"
  next: "16.3.3"
  react: "^19.2.8"
  react-dom: "^19.2.8"
  turbo: "^2.10.11"
  typescript: "7.0.2"
  next-intl: "^4.13.7"
  usehooks-ts: "^3.1.1"
  ky: "^2.0.2"
  "@tanstack/react-query": "^5.102.2"
  "@storybook/nextjs-vite": "^10.5.10"
  "@storybook/react": "^10.5.10"
  lucide-react: "^1.33.0"
  open-props: "^1.7.23"
  schema-dts: "^2.0.0"
  nuqs: "^2.10.0"
  "@tanstack/react-form": "^1.33.5"
  storybook: "^10.5.10"
  vite: "^8.2.2"
  "@vercel/speed-insights": "^2.0.0"
  "@babel/core": "^7.29.7"
  "@types/babel__core": "^7.20.5"
  "@stylexjs/stylex": "^0.19.0"
  "@stylexjs/babel-plugin": "^0.19.0"
  "@stylexjs/postcss-plugin": "^0.19.0"
