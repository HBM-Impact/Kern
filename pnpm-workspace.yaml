  typescript: "7.0.2"
  next-intl: "^4.14.9"
  usehooks-ts: "^3.1.1"
  ky: "^2.2.0"
  "@tanstack/react-query": "^5.104.1"
  "@storybook/react-vite": "^10.6.1"
  "@storybook/react": "^10.6.1"
  lucide-react: "^1.55.0"
  open-props: "^1.7.23"
